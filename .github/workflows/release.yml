name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & push container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists yet
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }}/Dockerfile not present yet — skipping image build"
          fi

      - name: Compute lowercase image name
        if: steps.check.outputs.exists == 'true'
        id: image
        # GHCR/OCI requires a lowercase repository path; github.repository_owner
        # is "Spillers-Technology" verbatim (mixed case), which buildx rejects
        # outright rather than silently lowercasing for you.
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'true'
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/corporate-simulator-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.owner }}/corporate-simulator-${{ matrix.service }}:latest

  github-release:
    name: Draft GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        id: notes
        run: |
          # Extracts the section matching THIS tag's version (v0.1.0 -> "## [0.1.0]"),
          # not [Unreleased] — by the time a version is tagged, its real content
          # should already be moved out of Unreleased and under its own heading
          # (see CONTRIBUTING.md's release checklist). Falls back to [Unreleased]
          # only if no matching versioned heading exists yet, so this doesn't
          # silently produce empty notes on a release-prep slip.
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for [$version] — falling back to [Unreleased]"
            awk '/^## \[Unreleased\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
