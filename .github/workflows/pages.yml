name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages is deliberately always a static landing page (site/), never the real
      # app build (frontend/). The app requires a live backend (REST/SSE replay,
      # eventually live-generation) that static Pages hosting cannot run — deploying
      # it there would just show visitors a permanently broken "backend unavailable"
      # screen instead of an intentional page. If a hosted demo (backend + frontend
      # both actually running somewhere) ever exists, linking to *that* from this
      # landing page is the right move, not swapping Pages' own content for the app
      # shell. See docs/spec.md for the self-hosting path in the meantime.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
