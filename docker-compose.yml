services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/data
    volumes:
      # Point this at your own real board-process data directory to run against
      # real data. Defaults to the bundled, hand-redacted demo fixture — never
      # mount real private data into a build of this image that gets published
      # anywhere; this is a local override for local use.
      #
      # Read-WRITE as of the Phase 0/1 human-input forms (docs/spec.md §13a): sealing
      # a motion or founder draft creates a `<date>-<slug>/` meeting directory here and
      # runs a real `git add` + `git commit` in whatever repository contains it. If you
      # point this at your own real process, the app now writes to it — that is the
      # feature, but know it before you mount it. Writes are contained to this directory
      # by the same `inside()` check replay-mode reads use, and a sealed motion or
      # founder draft is never rewritten in place.
      - ${DATA_DIR:-./demo-data}:/data
      # Each CLI (claude, codex) manages its own login/credential state. Persist
      # that across container restarts in a named volume rather than baking it
      # into an image layer or re-implementing credential storage — see
      # docs/spec.md's Authentication subsection.
      - cli-auth-claude:/home/node/.config/claude
      - cli-auth-codex:/home/node/.codex
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cli-auth-claude:
  cli-auth-codex:
